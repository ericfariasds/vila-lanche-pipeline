services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: vila_minio
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [vila_net]
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: vila_postgres
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vila_net]
    restart: unless-stopped

volumes:
  minio_data:
  pg_data:

networks:
  vila_net:
    name: vila_net